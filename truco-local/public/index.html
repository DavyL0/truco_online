<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Truco Mineiro 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0d1512;color:#f3ead6;font-family:'Lexend',Georgia,'Times New Roman',serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,11,.82);z-index:5}
.box{background:rgba(27,42,34,.9);backdrop-filter:blur(10px);border:1px solid #c9a24a;border-radius:18px;padding:24px;max-width:92vw;width:390px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
h1{margin:0 0 6px;color:#e8c46a;font-size:26px}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #577;background:#0f1a14;color:#fff;font-size:16px;box-sizing:border-box;text-align:center}
button{background:#c9a24a;color:#1a1208;border:0;border-radius:8px;padding:10px 16px;font-size:16px;font-weight:700;cursor:pointer;margin:4px;font-family:inherit}
button.r{background:#b3402e;color:#fff}button.g{background:#3f8f57;color:#fff}button.s{background:#35493d;color:#eee}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:2;pointer-events:none;text-shadow:0 1px 4px #000}
#scorebar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}#team0,#team1{font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}#sc{display:inline-block;padding:8px 22px;font-size:20px;font-weight:700;color:#fff;background:rgba(148,0,0,.73);border-radius:35px}#msg{font-size:15px;opacity:.9;margin-top:4px}
#btns{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:2}

.pl{padding:4px;border-bottom:1px solid #2f4538}.sm{font-size:13px;opacity:.8}
</style></head><body>
<div id="top" hidden><div id="scorebar"><span id="team0"></span><span id="sc"></span><span id="team1"></span></div><div id="msg"></div></div>
<div id="btns"></div>
<div class="ov" id="home"><div class="box"><h1>🃏 Truco Mineiro</h1>
<div class="sm">Jogue com amigos em tempo real</div>
<input id="nm" placeholder="Seu nome" maxlength="14">
<button id="mk">Criar sala</button><div class="sm">ou entre com um código</div>
<input id="cd" placeholder="CÓDIGO" maxlength="6" style="text-transform:uppercase">
<button class="s" id="jn">Entrar</button><div id="err"></div></div></div>
<div class="ov" id="lobby" style="display:none"><div class="box"><h1>Sala <span id="lc"></span></h1>
<div class="sm">Convide amigos com o link ou o código</div>
<button class="s" id="cp">Copiar link</button>
<div id="pls" style="margin:10px 0;text-align:left"></div><div class="sm" id="lh"></div><div id="ls"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);

/* ---------- Regras do jogo ---------- */
class GameRules {
  static SUIT_SYMBOLS = { C: '♣', H: '♥', S: '♠', D: '♦' };
  static MANILHAS = { '4C': 14, '7H': 13, 'AS': 12, '7D': 11 };
  static ORDINARY = { '3': 10, '2': 9, 'A': 8, 'K': 7, 'J': 6, 'Q': 5, '7': 4, '6': 3, '5': 2, '4': 1 };
  static BET_LABELS = { 3: 'TRUCO', 6: 'SEIS', 9: 'NOVE', 12: 'DOZE' };

  static cardStrength(card) {
    return this.MANILHAS[card] || this.ORDINARY[card.charAt(0)] || 0;
  }

  static nextBet(value) {
    return value === 1 ? 3 : value + 3;
  }

  static playerName(players, seat) {
    return players[seat] ? players[seat].name : '?';
  }

  static teamName(players, teamIndex) {
    return players
      .filter((_, index) => index % 2 === teamIndex)
      .map((player) => player.name)
      .join(' & ');
  }

  static canAsk(state, seat) {
    return (
      !!state &&
      state.phase === 'play' &&
      !state.pend &&
      state.turn === seat &&
      !state.ten &&
      state.value < 12 &&
      state.lastRaise !== seat % 2
    );
  }
}

/* ---------- Persistência local ---------- */
class StorageService {
  static getUserId() {
    let id = '';
    try {
      id = localStorage.getItem('trucoId') || '';
      if (!id) {
        id = Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('trucoId', id);
      }
    } catch (error) {
      id = id || Math.random().toString(36).slice(2);
    }
    return id;
  }

  static getSavedName() {
    try {
      return localStorage.getItem('trucoNome') || '';
    } catch (error) {
      return '';
    }
  }

  static saveName(name) {
    try {
      localStorage.setItem('trucoNome', name);
    } catch (error) {
      // Ignora falhas de armazenamento local.
    }
  }
}

/* ---------- Rede ---------- */
class NetworkService {
  async post(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return response.json();
  }
}

/* ---------- Renderização 3D ---------- */
class Renderer3D {
  constructor(app) {
    this.app = app;
    this.canvas = document.createElement('canvas');
    document.body.prepend(this.canvas);

    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0d1512);

    this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    this.fit = this.fit.bind(this);
    window.addEventListener('resize', this.fit);
    this.fit();

    this.scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const directional = new THREE.DirectionalLight(0xfff1d0, 0.8);
    directional.position.set(4, 12, 6);
    this.scene.add(directional);

    const textureLoader = new THREE.TextureLoader();
    const tableTexture = textureLoader.load('/texture/fundo_mesa.jpg');
    tableTexture.wrapS = THREE.RepeatWrapping;
    tableTexture.wrapT = THREE.RepeatWrapping;
    tableTexture.repeat.set(2, 2);

    const table = new THREE.Mesh(
      new THREE.CylinderGeometry(8.8, 8.8, 0.4, 64),
      new THREE.MeshStandardMaterial({ map: tableTexture, roughness: 0.85 })
    );
    table.scale.z = 0.8;
    table.position.y = -0.2;
    this.scene.add(table);

    const borderTexture = textureLoader.load('/texture/borda_mesa.jpg');
    borderTexture.wrapS = THREE.RepeatWrapping;
    borderTexture.wrapT = THREE.RepeatWrapping;

    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(8.8, 0.4, 16, 64),
      new THREE.MeshStandardMaterial({ map: borderTexture, roughness: 0.5 })
    );
    rim.rotation.x = Math.PI / 2;
    rim.scale.y = 0.8;
    rim.position.y = -0.05;
    this.scene.add(rim);

    this.planeGeometry = new THREE.PlaneGeometry(1.15, 1.6);
    this.textures = {};
    this.objects = {};

    this.canvas.addEventListener('pointermove', (event) => {
      this.app.hover = this.app.canPlay() ? this.pick(event) : null;
      this.canvas.style.cursor = this.app.hover ? 'pointer' : 'default';
    });
    this.canvas.addEventListener('pointerdown', (event) => {
      if (!this.app.canPlay()) return;
      const key = this.pick(event);
      if (key) {
        this.app.hover = null;
        this.app.send({ type: 'play', c: key });
      }
    });

    this.startLoop();
  }

  fit() {
    this.renderer.setSize(window.innerWidth, window.innerHeight, false);
    this.camera.aspect = window.innerWidth / window.innerHeight;
    const factor = Math.max(1, 1.25 / this.camera.aspect);
    this.camera.position.set(0, 10.5 * factor, 11.5 * factor);
    this.camera.lookAt(0, 0, 1.2);
    this.camera.updateProjectionMatrix();
  }

  texture(card) {
    if (this.textures[card]) return this.textures[card];

    const canvas = document.createElement('canvas');
    canvas.width = 200;
    canvas.height = 280;
    const context = canvas.getContext('2d');

    context.fillStyle = '#fbf6e8';
    if (context.roundRect) {
      context.beginPath();
      context.roundRect(0, 0, 200, 280, 16);
      context.fill();
    } else {
      context.fillRect(0, 0, 200, 280);
    }

    context.strokeStyle = '#bbb';
    context.lineWidth = 3;
    context.strokeRect(0, 0, 200, 280);

    if (card === 'back') {
      context.fillStyle = '#8c1f2b';
      context.fillRect(10, 10, 180, 260);
      context.strokeStyle = '#e8c46a';
      context.lineWidth = 4;
      context.strokeRect(22, 22, 156, 236);
      context.fillStyle = '#e8c46a';
      context.font = '80px serif';
      context.textAlign = 'center';
      context.fillText('♠', 100, 160);
    } else {
      const isRed = 'HD'.includes(card.charAt(1));
      context.fillStyle = isRed ? '#c0212f' : '#111';
      context.textAlign = 'center';
      context.font = 'bold 54px Georgia';
      context.fillText(card.charAt(0), 36, 64);
      context.font = '44px serif';
      context.fillText(GameRules.SUIT_SYMBOLS[card.charAt(1)], 36, 112);
      context.font = '110px serif';
      context.fillText(GameRules.SUIT_SYMBOLS[card.charAt(1)], 100, 172);
      context.save();
      context.translate(200, 280);
      context.rotate(Math.PI);
      context.font = 'bold 54px Georgia';
      context.fillText(card.charAt(0), 36, 64);
      context.restore();
      if (GameRules.MANILHAS[card]) {
        context.font = 'bold 18px Georgia';
        context.fillStyle = '#b8860b';
        context.fillText('MANILHA', 100, 262);
      }
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = 4;
    this.textures[card] = texture;
    return texture;
  }

  make(key, face) {
    const group = new THREE.Group();
    const front = new THREE.Mesh(
      this.planeGeometry,
      new THREE.MeshStandardMaterial({ map: this.texture(face || 'back') })
    );
    const back = new THREE.Mesh(
      this.planeGeometry,
      new THREE.MeshStandardMaterial({ map: this.texture('back') })
    );
    back.rotation.y = Math.PI;
    front.position.z = 0.01;
    back.position.z = -0.01;
    group.add(front, back);
    group.rotation.order = 'YXZ';
    group.position.set(0, 1, 0);
    group.rotation.x = -Math.PI / 2;
    group.userData = { key, hand: false };
    this.scene.add(group);
    return group;
  }

  direction(relative, totalPlayers) {
    return totalPlayers === 2 ? [0, 2][relative] : relative;
  }

  sync() {
    const state = this.app.state;
    if (!state || !state.hands) return;

    const totalPlayers = state.n;
    const mySeat = Math.max(this.app.mySeat, 0);
    const wanted = {};

    for (let seat = 0; seat < totalPlayers; seat += 1) {
      const relativeSeat = this.direction((seat - mySeat + totalPlayers) % totalPlayers, totalPlayers);
      const hand = state.hands[seat] || [];
      const cardCount = hand.length;
      const isMe = seat === this.app.mySeat;

      hand.forEach((card, index) => {
        const offset = index - (cardCount - 1) / 2;
        const key = isMe ? card : 'h' + seat + index;
        let position;
        let rotationX;
        let rotationY = 0;

        if (isMe) {
          position = [offset * 1.35, 1.1, 6.2];
          rotationX = -1.0;
        } else {
          rotationX = Math.PI / 2;
          if (relativeSeat === 2) {
            position = [offset * 0.9, 0.05, -5.2];
          } else if (relativeSeat === 1) {
            position = [-6.4, 0.05, offset * 0.9];
            rotationY = Math.PI / 2;
          } else if (relativeSeat === 3) {
            position = [6.4, 0.05, offset * 0.9];
            rotationY = Math.PI / 2;
          } else {
            position = [offset * 0.9, 0.05, 6];
          }
        }

        wanted[key] = {
          p: position,
          rx: rotationX,
          ry: rotationY,
          face: isMe ? card : null,
          hand: isMe,
        };
      });
    }

    const tableSpots = [[0.3, 1.7], [-2.2, 0.1], [0.3, -1.4], [2.4, 0.1]];
    (state.table || []).forEach((entry, index) => {
      const relativeSeat = this.direction((entry.s - mySeat + totalPlayers) % totalPlayers, totalPlayers);
      const spot = tableSpots[relativeSeat];
      wanted[entry.c] = {
        p: [spot[0] + (relativeSeat % 2 ? 0 : 0), 0.06 + index * 0.01, spot[1]],
        rx: -Math.PI / 2,
        ry: relativeSeat % 2 ? 0.35 : relativeSeat === 0 ? 0.12 : -0.1,
        face: entry.c,
        hand: false,
      };
    });

    for (const key in this.objects) {
      if (!wanted[key]) {
        this.scene.remove(this.objects[key]);
        delete this.objects[key];
      }
    }

    for (const key in wanted) {
      const spec = wanted[key];
      if (!this.objects[key]) {
        this.objects[key] = this.make(key, spec.face);
      }
      this.objects[key].userData.target = spec;
      this.objects[key].userData.hand = spec.hand;
    }
  }

  pick(event) {
    const mouse = new THREE.Vector2();
    mouse.set((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, this.camera);

    const selectable = Object.values(this.objects).filter((object) => object.userData.hand);
    const intersections = raycaster.intersectObjects(selectable, true);
    if (!intersections.length) return null;

    let object = intersections[0].object;
    while (object && !object.userData.key) object = object.parent;
    return object ? object.userData.key : null;
  }

  startLoop() {
    const animate = () => {
      requestAnimationFrame(animate);
      for (const key in this.objects) {
        const group = this.objects[key];
        const target = group.userData.target;
        if (!target) continue;

        const position = new THREE.Vector3(...target.p);
        if (this.app.hover === key) {
          position.y += 0.5;
          position.z -= 0.6;
        }
        group.position.lerp(position, 0.14);
        group.rotation.x += (target.rx - group.rotation.x) * 0.14;
        group.rotation.y += (target.ry - group.rotation.y) * 0.14;
      }
      this.renderer.render(this.scene, this.camera);
    };
    animate();
  }
}

/* ---------- Aplicação ---------- */
class TrucoApp {
  constructor() {
    this.userId = StorageService.getUserId();
    this.code = null;
    this.token = null;
    this.state = null;
    this.mySeat = -1;
    this.hover = null;
    this.network = new NetworkService();
    this.renderer = new Renderer3D(this);

    this.bindDom();

    const requestedRoom = new URLSearchParams(window.location.search).get('sala');
    if (requestedRoom) $('cd').value = requestedRoom;

    const savedName = StorageService.getSavedName();
    if (savedName) $('nm').value = savedName;
  }

  bindDom() {
    $('mk').addEventListener('click', () => this.enter('', true));
    $('jn').addEventListener('click', () => {
      const code = $('cd').value.trim();
      if (code) this.enter(code.toUpperCase(), false);
    });
    $('cp').addEventListener('click', () => {
      try {
        navigator.clipboard.writeText(this.link());
      } catch (error) {
        // Ignora falhas de cópia.
      }
      $('cp').textContent = 'Link copiado!';
      setTimeout(() => {
        $('cp').textContent = 'Copiar link';
      }, 1500);
    });
  }

  async enter(code, create) {
    const name = ($('nm').value.trim() || 'Jogador').slice(0, 14);
    StorageService.saveName(name);

    const response = await this.network.post(create ? '/api/create' : '/api/join', {
      code,
      id: this.userId,
      name,
    });

    if (response.error) {
      $('err').textContent = response.error;
      return;
    }

    this.code = response.code;
    this.token = response.token || null;
    if (create) {
      const joinResponse = await this.network.post('/api/join', { code: this.code, id: this.userId, name });
      if (joinResponse.token) this.token = joinResponse.token;
    }

    history.replaceState(null, '', '?sala=' + this.code);
    $('home').style.display = 'none';

    const events = new EventSource('/api/events?code=' + this.code + '&id=' + this.userId + '&token=' + (this.token || ''));
    events.onmessage = (event) => {
      this.state = JSON.parse(event.data);
      this.render();
    };
  }

  send(action) {
    return this.network.post('/api/act', { ...action, code: this.code, id: this.userId, token: this.token });
  }

  link() {
    return location.origin + '/?sala=' + this.code;
  }

  btn(label, onClick, className) {
    const button = document.createElement('button');
    button.textContent = label;
    if (className) button.className = className;
    button.onclick = onClick;
    $('btns').appendChild(button);
  }

  canPlay() {
    return (
      !!this.state &&
      this.state.phase === 'play' &&
      !this.state.pend &&
      this.state.turn === this.mySeat &&
      this.mySeat >= 0
    );
  }

  render() {
    if (!this.state || !this.state.players) return;

    this.mySeat = this.state.players.findIndex((player) => player.id === this.userId);

    const isLobby = this.state.phase === 'lobby';
    $('lobby').style.display = isLobby ? 'flex' : 'none';
    $('top').hidden = isLobby;
    $('btns').innerHTML = '';

    if (isLobby) {
      $('lc').textContent = this.code;
      const playersContainer = $('pls');
      playersContainer.innerHTML = '';
      this.state.players.forEach((player, index) => {
        const item = document.createElement('div');
        item.className = 'pl';
        item.textContent =
          index + 1 +
          '. ' +
          player.name +
          (player.isBot ? ' (bot)' : '') +
          (player.id === this.state.host ? ' (anfitrião)' : '') +
          (player.id === this.userId ? ' — você' : '') +
          '  · Time ' +
          (index % 2 + 1);
        playersContainer.appendChild(item);
      });

      const playerCount = this.state.players.length;
      const canStart = playerCount === 2 || playerCount === 4;
      if (playerCount === 3) {
        $('lh').textContent = 'Truco se joga em 2 ou 4 pessoas. Aguardando mais um...';
      } else if (playerCount === 1) {
        $('lh').textContent = 'Aguardando jogadores...';
      } else {
        $('lh').textContent = 'Em 4 jogadores, os parceiros são 1º+3º e 2º+4º.';
      }

      $('ls').innerHTML = '';
      if (this.state.host === this.userId) {
        if (this.state.players.length < 4) {
          const addBotButton = document.createElement('button');
          addBotButton.textContent = 'Adicionar bot';
          addBotButton.className = 's';
          addBotButton.onclick = () => this.send({ type: 'addBot' });
          $('ls').appendChild(addBotButton);
        }
        if (this.state.players.some((player) => player.isBot)) {
          const removeBotButton = document.createElement('button');
          removeBotButton.textContent = 'Remover bot';
          removeBotButton.className = 's';
          removeBotButton.onclick = () => this.send({ type: 'removeBot' });
          $('ls').appendChild(removeBotButton);
        }
      }
      if (this.state.host === this.userId && canStart) {
        const startButton = document.createElement('button');
        startButton.textContent = 'Começar partida';
        startButton.onclick = () => this.send({ type: 'start' });
        $('ls').appendChild(startButton);
      }

      this.renderer.sync();
      return;
    }

    $('team0').textContent = GameRules.teamName(this.state.players, 0);
    $('sc').textContent = this.state.score[0] + ' × ' + this.state.score[1];
    $('team1').textContent = GameRules.teamName(this.state.players, 1);

    const statusText =
      this.state.phase === 'over'
        ? ''
        : this.state.pend
        ? 'Aguardando resposta ao pedido...'
        : 'Vez de ' + GameRules.playerName(this.state.players, this.state.turn);

    $('msg').textContent =
      this.state.msg + (statusText ? ' · ' + statusText : '') + ' · Mão vale ' + this.state.value;

    if (this.state.phase === 'over' && this.state.host === this.userId) {
      this.btn('Nova partida', () => this.send({ type: 'again' }), 'g');
    }

    if (this.state.phase === 'play' && this.mySeat >= 0) {
      if (this.state.pend && this.mySeat % 2 !== this.state.pend.team) {
        this.btn('Aceitar', () => this.send({ type: 'accept' }), 'g');
        this.btn('Correr', () => this.send({ type: 'run' }), 'r');
        if (this.state.pend.to < 12) {
          this.btn('Aumentar p/ ' + GameRules.nextBet(this.state.pend.to), () =>
            this.send({ type: 'raise' })
          );
        }
      } else if (GameRules.canAsk(this.state, this.mySeat)) {
        const nextValue = GameRules.nextBet(this.state.value);
        const labels = { 3: 'TRUCO!', 6: 'SEIS!', 9: 'NOVE!', 12: 'DOZE!' };
        this.btn(labels[nextValue], () => this.send({ type: 'truco' }), 'r');
      }
    }

    this.renderer.sync();
  }
}

const app = new TrucoApp();
</script></body></html>
